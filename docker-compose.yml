version: '3.8'

services:
  # PostgreSQL - Central data store for posts, metrics, leads, conversations, campaigns
  postgres:
    image: pgvector/pgvector:pg16
    container_name: marketing_hub_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-marketing_hub}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./infrastructure/db/initial-data.sql:/docker-entrypoint-initdb.d/02-initial-data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marketing_hub

  # Redis - Caching layer for hot metrics
  redis:
    image: redis:7-alpine
    container_name: marketing_hub_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marketing_hub

  # n8n - Workflow automation engine
  n8n:
    image: n8nio/n8n:latest
    container_name: marketing_hub_n8n
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${DB_NAME:-marketing_hub}
      DB_POSTGRESDB_USER: ${DB_USER:-postgres}
      DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD:-postgres_dev}
      N8N_HOST: ${N8N_HOST:-0.0.0.0}
      N8N_PORT: ${N8N_PORT:-5678}
      N8N_PROTOCOL: https
      NODE_ENV: ${NODE_ENV:-production}
      WEBHOOK_URL: https://${APP_DOMAIN:-localhost}/n8n/
      N8N_SECURE_COOKIE: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change_me_in_production_min_32_chars}
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/n8n-workflows
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marketing_hub

  # FastAPI - LangGraph agents service
  agents:
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: marketing_hub_agents
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres_dev}@postgres:5432/${DB_NAME:-marketing_hub}
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AGENT_API_KEY: ${AGENT_API_KEY:-change_me_in_production}
      ENVIRONMENT: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${AGENTS_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marketing_hub
    restart: unless-stopped

  # Metabase - Analytics & reporting dashboard
  metabase:
    image: metabase/metabase:latest
    container_name: marketing_hub_metabase
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${DB_NAME:-marketing_hub}
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_USER: ${DB_USER:-postgres}
      MB_DB_PASS: ${DB_PASSWORD:-postgres_dev}
      MB_ENCRYPTION_SECRET_KEY: ${METABASE_SECRET:-change_me_in_production}
    ports:
      - "${METABASE_PORT:-3001}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marketing_hub
    restart: unless-stopped

  # Next.js / TanStack UI - Content calendar, lead pipeline, broadcasts
  ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: marketing_hub_ui
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres_dev}@postgres:5432/${DB_NAME:-marketing_hub}
      AGENT_SERVICE_URL: http://agents:8000
      AGENT_API_KEY: ${AGENT_API_KEY:-change_me_in_production}
    ports:
      - "8080:3000"
    depends_on:
      postgres:
        condition: service_healthy
      agents:
        condition: service_healthy
    networks:
      - marketing_hub
    restart: unless-stopped

  # Nginx - Reverse proxy for SSL and routing
  nginx:
    build:
      context: ./infrastructure/nginx
      dockerfile: Dockerfile
    container_name: marketing_hub_nginx
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - n8n
      - agents
      - metabase
    networks:
      - marketing_hub
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  n8n_data:

networks:
  marketing_hub:
    driver: bridge
